services:
  backend:
    build:
      context: ./backend
    container_name: superkart-backend
    ports:
      - "7861:7860"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: superkart-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:7860
    ports:
      - "8502:8501"
    restart: unless-stopped
