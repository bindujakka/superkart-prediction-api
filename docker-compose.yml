services:
  backend:
    build:
      context: ./backend
    container_name: superkart-backend
    ports:
      - "7860:7860"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: superkart-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://host.docker.internal:7860
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    restart: unless-stopped
